<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
        
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 32px; color: #1a2a3a; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: #888; margin-top: 8px; font-size: 16px; }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .category-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .category-card .category-image {
            height: 200px;
            background: #f8f7f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: #c9a94e;
            transition: all 0.3s ease;
        }
        .category-card:hover .category-image { background: #e8d5a3; }
        .category-card .category-info { padding: 24px; }
        .category-card .category-info h3 { font-size: 20px; color: #1a2a3a; margin-bottom: 4px; }
        .category-card .category-info p { color: #888; font-size: 14px; margin-bottom: 12px; }
        .category-card .category-info .count { color: #c9a94e; font-weight: 600; font-size: 14px; }
        .category-card .category-info .count i { margin-right: 6px; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
            .categories-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .categories-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Shop by <span>Category</span></h1>
            <p>Find exactly what you're looking for in our curated collections.</p>
        </div>

        <div class="categories-grid" id="categoriesGrid">
            <!-- Categories loaded from API -->
            <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">
                <i class="fas fa-spinner fa-spin" style="font-size:48px;"></i>
                <h3 style="margin-top:16px;">Loading categories...</h3>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        let allCategories = [];

        // ============================================
        // CHECK LOGIN
        // ============================================
        const user = localStorage.getItem('user');
        if (user) {
            const currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
        }

        // ============================================
        // LOAD CATEGORIES
        // ============================================
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/categories`);
                const data = await response.json();
                
                if (data.success) {
                    allCategories = data.categories || [];
                    renderCategories(allCategories);
                } else {
                    document.getElementById('categoriesGrid').innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">
                            <i class="fas fa-exclamation-triangle" style="font-size:48px; color:#ef4444;"></i>
                            <h3 style="margin-top:16px;">Failed to load categories</h3>
                            <p>Please try again later.</p>
                            <button class="btn btn-primary" onclick="loadCategories()" style="margin-top:16px;">
                                <i class="fas fa-sync-alt"></i> Retry
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading categories:', error);
                document.getElementById('categoriesGrid').innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">
                        <i class="fas fa-wifi" style="font-size:48px; color:#ef4444;"></i>
                        <h3 style="margin-top:16px;">Network Error</h3>
                        <p>Could not connect to the server.</p>
                        <button class="btn btn-primary" onclick="loadCategories()" style="margin-top:16px;">
                            <i class="fas fa-sync-alt"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        function renderCategories(categories) {
            const grid = document.getElementById('categoriesGrid');
            
            if (!categories || categories.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">
                        <i class="fas fa-th-large" style="font-size:48px; color:#ddd;"></i>
                        <h3 style="margin-top:16px;">No Categories Found</h3>
                        <p>Check back later for new categories.</p>
                    </div>
                `;
                return;
            }

            const categoryIcons = {
                'Beds': 'fa-bed',
                'Sofas': 'fa-couch',
                'Tables': 'fa-table',
                'Chairs': 'fa-chair',
                'Cabinets': 'fa-cabinet',
                'Dressing Tables': 'fa-mirror',
                'Wardrobes': 'fa-wardrobe'
            };

            grid.innerHTML = categories.map(category => {
                const icon = categoryIcons[category.name] || 'fa-tag';
                const productCount = category.productCount || 0;
                
                return `
                    <a href="products.html?category=${encodeURIComponent(category.name)}" class="category-card">
                        <div class="category-image"><i class="fas ${icon}"></i></div>
                        <div class="category-info">
                            <h3>${category.name}</h3>
                            <p>${category.description || 'Explore our collection'}</p>
                            <span class="count"><i class="fas fa-tag"></i> ${productCount} Products</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
        });
    </script>
</body>
</html>
