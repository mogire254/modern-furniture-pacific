<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Chat - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f7f4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .chat-header .logo { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
        .chat-header .logo img { height: 35px; width: auto; }
        .chat-header .user-info { display: flex; align-items: center; gap: 12px; }
        .chat-header .user-info img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #8b5cf6;
            object-fit: cover;
        }
        .chat-header .user-info .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .chat-header .user-info .status-dot.online { background: #10b981; }
        .chat-header .user-info .status-dot.offline { background: #ef4444; }
        .btn-back {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .chat-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e9e7e2;
            padding: 16px;
            overflow-y: auto;
        }
        .chat-sidebar h3 { font-size: 14px; color: #1a2a3a; margin-bottom: 12px; }
        .chat-sidebar .admin-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
        }
        .chat-sidebar .admin-item:hover { background: #f8f7f4; }
        .chat-sidebar .admin-item.active {
            background: #f8f7f4;
            border-left-color: #8b5cf6;
        }
        .chat-sidebar .admin-item .admin-name { font-weight: 600; color: #1a2a3a; }
        .chat-sidebar .admin-item .admin-role { font-size: 12px; color: #888; }
        .chat-sidebar .admin-item .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .chat-sidebar .admin-item .status-dot.online { background: #10b981; }
        .chat-sidebar .admin-item .status-dot.offline { background: #ef4444; }
        .chat-sidebar .admin-item .unread {
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 1px 8px;
            font-size: 10px;
            margin-left: 8px;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-main-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e9e7e2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-main-header .chat-with { font-weight: 600; color: #1a2a3a; }
        .chat-main-header .chat-with .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 8px;
        }
        .chat-main-header .chat-with .status-dot.online { background: #10b981; }
        .chat-main-header .chat-with .status-dot.offline { background: #ef4444; }

        .chat-messages {
            flex: 1;
            padding: 16px 24px;
            overflow-y: auto;
            background: #fafafa;
        }
        .chat-messages .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }
        .chat-messages .message.sent {
            align-self: flex-end;
            background: #8b5cf6;
            color: white;
            margin-left: auto;
        }
        .chat-messages .message.received {
            align-self: flex-start;
            background: #f8f7f4;
            color: #1a2a3a;
        }
        .chat-messages .message .msg-time {
            font-size: 10px;
            opacity: 0.7;
            display: block;
            margin-top: 2px;
        }
        .chat-messages .message.sent .msg-time { color: rgba(255,255,255,0.7); }
        .chat-messages .message.received .msg-time { color: #888; }
        .chat-messages .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .chat-messages .empty-state i { font-size: 48px; color: #ddd; margin-bottom: 16px; }

        .chat-input {
            padding: 16px 24px;
            border-top: 1px solid #e9e7e2;
            display: flex;
            gap: 12px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e9e7e2;
            border-radius: 50px;
            font-size: 14px;
            font-family: inherit;
        }
        .chat-input input:focus { outline: none; border-color: #8b5cf6; }
        .chat-input button {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: #8b5cf6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .chat-input button:hover { background: #7c3aed; }
        .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close-toast { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .chat-sidebar { width: 200px; }
            .chat-messages .message { max-width: 85%; }
            .chat-main-header { padding: 12px 16px; }
            .chat-messages { padding: 12px 16px; }
            .chat-input { padding: 12px 16px; }
        }

        @media (max-width: 480px) {
            .chat-body { flex-direction: column; }
            .chat-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e9e7e2;
                max-height: 150px;
            }
            .chat-messages .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="chat-header">
        <div class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Admin Chat</span>
        </div>
        <div class="user-info">
            <span class="status-dot online" id="myStatusDot"></span>
            <img src="../assets/images/avatar-default.png" alt="Admin" id="myAvatar" />
            <span id="myName">Admin</span>
            <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
    </header>

    <!-- Chat Body -->
    <div class="chat-body">

        <!-- Sidebar -->
        <div class="chat-sidebar" id="chatSidebar">
            <h3><i class="fas fa-users" style="color:#8b5cf6;"></i> Admins Online</h3>
            <div id="adminList">
                <div class="empty-state" style="padding:20px;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading admins...</p>
                </div>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="chat-main">
            <div class="chat-main-header">
                <div class="chat-with" id="chatWith">
                    <span>Select an admin to chat</span>
                    <span class="status-dot offline"></span>
                </div>
                <span style="color:#888; font-size:13px;" id="chatStatus">Click a contact to start chatting</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <i class="fas fa-comment-dots"></i>
                    <h3>No messages</h3>
                    <p>Select an admin from the sidebar to start chatting.</p>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message..." disabled />
                <button id="sendBtn" onclick="sendMessage()" disabled><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <button class="close-toast" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        let currentUser = null;
        let allAdmins = [];
        let currentChatId = null;
        let chatMessages = [];
        let pollingInterval = null;

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // AUTH
        // ============================================
        function getToken() { return localStorage.getItem('token'); }

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`
            };
        }

        function isLoggedIn() {
            const token = getToken();
            const user = localStorage.getItem('user');
            return !!(token && user);
        }

        function getCurrentUser() {
            try {
                const user = localStorage.getItem('user');
                if (!user) return null;
                return JSON.parse(user);
            } catch (e) { return null; }
        }

        function goBack() {
            const from = sessionStorage.getItem('chatFrom') || 'dashboard.html';
            window.location.href = from;
        }

        // ============================================
        // LOAD ADMINS
        // ============================================
        async function loadAdmins() {
            try {
                const token = getToken();
                const response = await fetch(`${API_URL}/admins`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success) {
                    allAdmins = data.admins || [];
                    // Remove current user from list
                    allAdmins = allAdmins.filter(a => a.id !== currentUser.id);
                    renderAdmins();

                    // Auto-select first admin if available
                    if (allAdmins.length > 0 && !currentChatId) {
                        selectAdmin(allAdmins[0].id);
                    }
                }
            } catch (error) {
                console.error('Error loading admins:', error);
                showToast('❌ Failed to load admins');
            }
        }

        function renderAdmins() {
            const container = document.getElementById('adminList');

            if (!allAdmins || allAdmins.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:20px;">
                        <i class="fas fa-users" style="font-size:32px; color:#ddd;"></i>
                        <p style="margin-top:8px;">No other admins online.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allAdmins.map(admin => {
                const isOnline = admin.isActive !== false;
                const isActive = admin.id === currentChatId;

                return `
                    <div class="admin-item ${isActive ? 'active' : ''}" onclick="selectAdmin('${admin.id}')">
                        <div class="admin-name">
                            <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                            ${admin.name || 'Admin'}
                            ${!isOnline ? ' (Offline)' : ''}
                        </div>
                        <div class="admin-role">${admin.role || 'Admin'} ${admin.branch ? '• ' + admin.branch : ''}</div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // SELECT ADMIN
        // ============================================
        async function selectAdmin(adminId) {
            currentChatId = adminId;
            const admin = allAdmins.find(a => a.id === adminId);

            // Update UI
            document.querySelectorAll('.admin-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.admin-item[onclick="selectAdmin('${adminId}')"]`)?.classList.add('active');

            document.getElementById('chatWith').innerHTML = `
                <span>${admin ? admin.name : 'Unknown'}</span>
                <span class="status-dot ${admin && admin.isActive !== false ? 'online' : 'offline'}"></span>
            `;
            document.getElementById('chatStatus').textContent = admin && admin.isActive !== false ? '🟢 Online' : '🔴 Offline';

            // Enable input
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            // Load messages
            await loadChatMessages(adminId);

            // Start polling
            startPolling(adminId);
        }

        // ============================================
        // LOAD CHAT MESSAGES
        // ============================================
        async function loadChatMessages(adminId) {
            try {
                const token = getToken();
                const response = await fetch(`${API_URL}/admin-chat/${adminId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.success) {
                    chatMessages = data.messages || [];
                    renderMessages();
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');

            if (!chatMessages || chatMessages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-dots"></i>
                        <h3>No messages</h3>
                        <p>Start a conversation with this admin.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = chatMessages.map(msg => {
                const isSent = msg.senderId === currentUser.id;
                const senderName = isSent ? 'You' : (msg.senderName || 'Admin');
                const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString() : '';

                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div>${msg.message}</div>
                        <span class="msg-time">${senderName} • ${time}</span>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        // ============================================
        // SEND MESSAGE
        // ============================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !currentChatId) {
                showToast('⚠️ Select an admin to chat with');
                return;
            }

            try {
                const token = getToken();
                const response = await fetch(`${API_URL}/admin-chat/send`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        receiverId: currentChatId,
                        message: message
                    })
                });

                const data = await response.json();

                if (data.success) {
                    input.value = '';
                    // Add message locally
                    chatMessages.push({
                        id: data.messageId || Date.now().toString(),
                        senderId: currentUser.id,
                        senderName: currentUser.name,
                        message: message,
                        createdAt: new Date().toISOString()
                    });
                    renderMessages();
                } else {
                    showToast('❌ ' + (data.message || 'Failed to send message'));
                }
            } catch (error) {
                console.error('Error sending message:', error);
                showToast('❌ Failed to send message');
            }
        }

        // ============================================
        // POLLING FOR NEW MESSAGES
        // ============================================
        function startPolling(adminId) {
            // Clear existing interval
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }

            // Poll every 5 seconds
            pollingInterval = setInterval(async () => {
                if (!adminId) return;
                try {
                    const token = getToken();
                    const response = await fetch(`${API_URL}/admin-chat/${adminId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await response.json();

                    if (data.success && data.messages) {
                        // Check if new messages arrived
                        if (data.messages.length !== chatMessages.length) {
                            chatMessages = data.messages;
                            renderMessages();
                            // Play notification sound if new message received
                            if (data.messages.length > 0) {
                                const lastMsg = data.messages[data.messages.length - 1];
                                if (lastMsg.senderId !== currentUser.id) {
                                    // Optional: play sound or show notification
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 5000);
        }

        // ============================================
        // DOM READY
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            if (!isLoggedIn()) {
                window.location.href = 'admin-login.html';
                return;
            }

            currentUser = getCurrentUser();
            if (!currentUser) {
                window.location.href = 'admin-login.html';
                return;
            }

            document.getElementById('myName').textContent = currentUser.name || 'Admin';
            if (currentUser.profileImage) {
                document.getElementById('myAvatar').src = currentUser.profileImage;
            }

            // Save current page for back button
            const referrer = document.referrer;
            if (referrer) {
                sessionStorage.setItem('chatFrom', referrer);
            }

            loadAdmins();

            // Enter key to send
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            console.log('✅ Admin Chat loaded');
        });

        // Clean up polling on page unload
        window.addEventListener('beforeunload', () => {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        });
    </script>
</body>
</html>
