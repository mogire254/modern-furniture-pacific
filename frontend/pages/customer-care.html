<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Care - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 32px 20px; }
        
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 32px; color: #1a2a3a; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: #888; margin-top: 8px; font-size: 16px; }
        
        .care-form {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .care-form .logo { text-align: center; margin-bottom: 24px; }
        .care-form .logo img { height: 60px; width: auto; margin-bottom: 8px; }
        .care-form .logo h2 { font-size: 24px; color: #1a2a3a; }
        .care-form .logo p { color: #888; font-size: 14px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #1a2a3a; margin-bottom: 6px; }
        .form-group label i { color: #c9a94e; margin-right: 8px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9e7e2;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8f7f4;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #c9a94e;
            box-shadow: 0 0 0 4px rgba(201,169,78,0.15);
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            width: 100%;
            justify-content: center;
        }
        .btn-primary { background: #c9a94e; color: #1a2a3a; }
        .btn-primary:hover { background: #e8d5a3; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(201,169,78,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .message-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }
        .message-box.success { display: block; background: #d1fae5; color: #065f46; }
        .message-box.error { display: block; background: #fee2e2; color: #991b1b; }
        
        .back-link { display: inline-block; margin-top: 16px; color: #c9a94e; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        .chat-history {
            max-height: 300px;
            overflow-y: auto;
            background: #f8f7f4;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .chat-message {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
        }
        .chat-message.user {
            background: #dbeafe;
            margin-right: auto;
            max-width: 80%;
        }
        .chat-message.admin {
            background: #fef3c7;
            margin-left: auto;
            max-width: 80%;
        }
        .chat-message .msg-sender {
            font-size: 11px;
            color: #888;
            font-weight: 600;
        }
        .chat-message .msg-time {
            font-size: 10px;
            color: #aaa;
            display: block;
            margin-top: 2px;
        }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
            .care-form { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Customer <span>Care</span></h1>
            <p>We're here to help. Send us a message and our team will respond shortly.</p>
        </div>

        <div class="care-form">
            <div class="logo">
                <img src="../assets/images/logo.png" alt="Logo" />
                <h2>Contact Support</h2>
                <p>Our team will get back to you within 24 hours</p>
            </div>

            <!-- Chat History -->
            <div id="chatHistory" class="chat-history">
                <div style="text-align:center; padding:20px; color:#888;">
                    <i class="fas fa-comments" style="font-size:32px; color:#c9a94e;"></i>
                    <p style="margin-top:8px;">No messages yet. Start a conversation!</p>
                </div>
            </div>

            <form id="careForm" onsubmit="sendMessage(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Your Name</label>
                    <input type="text" id="careName" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="careEmail" placeholder="john@example.com" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone (Optional)</label>
                    <input type="tel" id="carePhone" placeholder="+254 700 123 456" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Subject</label>
                    <select id="careSubject" required>
                        <option value="General Inquiry">General Inquiry</option>
                        <option value="Product Question">Product Question</option>
                        <option value="Order Issue">Order Issue</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Returns">Returns</option>
                        <option value="Custom Order">Custom Order</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-comment"></i> Message</label>
                    <textarea id="careMessage" placeholder="Describe your question or issue in detail..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
                <div id="careMessageBox" class="message-box"></div>
            </form>

            <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';

        // ============================================
        // CHECK LOGIN
        // ============================================
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');
        let currentUser = null;

        if (user) {
            currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
            document.getElementById('careName').value = currentUser.name || '';
            document.getElementById('careEmail').value = currentUser.email || '';
            document.getElementById('carePhone').value = currentUser.phone || '';
        } else {
            document.getElementById('userName').textContent = 'Guest';
        }

        // ============================================
        // ===== FIXED: LOAD CHAT HISTORY =====
        // Uses /api/customer-care/my
        // ============================================
        async function loadChatHistory() {
            if (!token) return;

            try {
                // FIXED: Use /api/customer-care/my
                const response = await fetch(`${API_URL}/customer-care/my`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();

                const container = document.getElementById('chatHistory');
                if (data.success && data.messages && data.messages.length > 0) {
                    container.innerHTML = data.messages.map(msg => `
                        <div class="chat-message ${msg.sender === 'user' ? 'user' : 'admin'}">
                            <div class="msg-sender">${msg.sender === 'user' ? 'You' : 'Support'}</div>
                            <div>${msg.message}</div>
                            <span class="msg-time">${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</span>
                        </div>
                    `).join('');
                    container.scrollTop = container.scrollHeight;
                } else {
                    container.innerHTML = `
                        <div style="text-align:center; padding:20px; color:#888;">
                            <i class="fas fa-comments" style="font-size:32px; color:#c9a94e;"></i>
                            <p style="margin-top:8px;">No messages yet. Start a conversation!</p>
                            <p style="font-size:13px;">Our support team typically responds within minutes.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
            }
        }

        // ============================================
        // ===== FIXED: SEND MESSAGE =====
        // Uses /api/customer-care/send
        // ============================================
        async function sendMessage(event) {
            event.preventDefault();

            if (!token) {
                showToast('⚠️ Please login to send a message');
                window.location.href = 'login.html';
                return;
            }

            const name = document.getElementById('careName').value;
            const email = document.getElementById('careEmail').value;
            const phone = document.getElementById('carePhone').value;
            const subject = document.getElementById('careSubject').value;
            const message = document.getElementById('careMessage').value;
            const msgBox = document.getElementById('careMessageBox');
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;

            msgBox.style.display = 'none';

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

                // FIXED: Use /api/customer-care/send
                const response = await fetch(`${API_URL}/customer-care/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, email, phone, subject, message })
                });

                const data = await response.json();

                if (data.success) {
                    msgBox.className = 'message-box success';
                    msgBox.textContent = '✅ Your message has been sent! Our team will respond shortly.';
                    msgBox.style.display = 'block';
                    document.getElementById('careMessage').value = '';
                    btn.innerHTML = '<i class="fas fa-check"></i> Sent!';
                    
                    // Reload chat history
                    loadChatHistory();
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }, 3000);
                } else {
                    msgBox.className = 'message-box error';
                    msgBox.textContent = '❌ ' + (data.message || 'Failed to send message. Please try again.');
                    msgBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                console.error('Error sending message:', error);
                msgBox.className = 'message-box error';
                msgBox.textContent = '❌ Network error. Please check your connection.';
                msgBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            if (token) {
                loadChatHistory();
            }
        });
    </script>
</body>
</html>
