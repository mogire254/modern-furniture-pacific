<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
        
        .breadcrumb { margin-bottom: 24px; font-size: 14px; color: #888; }
        .breadcrumb a { color: #c9a94e; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .product-gallery { position: relative; }
        .product-gallery .main-image {
            width: 100%;
            height: 400px;
            background: #f8f7f4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: #c9a94e;
            overflow: hidden;
            cursor: pointer;
        }
        .product-gallery .main-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-gallery .main-image video { width: 100%; height: 100%; object-fit: cover; }
        .product-gallery .thumbnails {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .product-gallery .thumbnails .thumb {
            width: 80px;
            height: 80px;
            background: #f8f7f4;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 24px;
            color: #c9a94e;
        }
        .product-gallery .thumbnails .thumb:hover,
        .product-gallery .thumbnails .thumb.active {
            border-color: #c9a94e;
        }
        .product-gallery .thumbnails .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .product-gallery .thumbnails .thumb video { width: 100%; height: 100%; object-fit: cover; }
        
        .product-info h1 { font-size: 28px; color: #1a2a3a; margin-bottom: 8px; }
        .product-info .rating { color: #f59e0b; margin-bottom: 12px; }
        .product-info .rating span { color: #888; font-size: 14px; margin-left: 8px; }
        .product-info .price { font-size: 32px; font-weight: 700; color: #c9a94e; }
        .product-info .old-price { text-decoration: line-through; color: #888; font-size: 20px; margin-left: 12px; }
        .product-info .status {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0;
        }
        .product-info .status.available { background: #d1fae5; color: #065f46; }
        .product-info .status.sold { background: #fee2e2; color: #991b1b; }
        .product-info .status.pre-order { background: #fef3c7; color: #92400e; }
        .product-info .description { color: #666; line-height: 1.8; margin-bottom: 20px; }
        .product-info .specs {
            background: #f8f7f4;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .product-info .specs table { width: 100%; font-size: 14px; }
        .product-info .specs td { padding: 6px 0; }
        .product-info .specs td:first-child { font-weight: 600; color: #1a2a3a; width: 40%; }
        .product-info .specs td:last-child { color: #666; }
        
        .product-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary { background: #c9a94e; color: #1a2a3a; }
        .btn-primary:hover { background: #e8d5a3; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(201,169,78,0.3); }
        .btn-outline { background: transparent; color: #1a2a3a; border: 2px solid #e9e7e2; }
        .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-lg { padding: 14px 36px; font-size: 16px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .notify-btn {
            background: #fef3c7;
            color: #92400e;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .notify-btn:hover { background: #fde68a; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .product-detail { grid-template-columns: 1fr; padding: 16px; }
            .product-gallery .main-image { height: 250px; }
            .product-actions { flex-direction: column; }
            .product-actions .btn { width: 100%; justify-content: center; }
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="breadcrumb" id="breadcrumb">
            <a href="dashboard.html">Home</a> &gt;
            <a href="products.html">Products</a> &gt;
            <span id="productName">Loading...</span>
        </div>

        <div class="product-detail" id="productDetail">
            <div class="product-gallery">
                <div class="main-image" id="mainImage">
                    <i class="fas fa-spinner fa-spin" style="font-size:32px;"></i>
                </div>
                <div class="thumbnails" id="thumbnails"></div>
            </div>
            <div class="product-info" id="productInfo">
                <h1 id="productTitle">Loading...</h1>
                <div class="rating" id="productRating">⭐⭐⭐⭐⭐ <span>(0 reviews)</span></div>
                <div>
                    <span class="price" id="productPrice">KSh 0</span>
                    <span class="old-price" id="productOldPrice"></span>
                </div>
                <span class="status" id="productStatus">● Loading...</span>
                <p class="description" id="productDescription">Loading product details...</p>
                <div class="specs" id="productSpecs">
                    <table>
                        <tr><td>Material</td><td id="specMaterial">Loading...</td></tr>
                        <tr><td>Dimensions</td><td id="specDimensions">Loading...</td></tr>
                        <tr><td>Weight</td><td id="specWeight">Loading...</td></tr>
                        <tr><td>Stock</td><td id="specStock">Loading...</td></tr>
                        <tr><td>Category</td><td id="specCategory">Loading...</td></tr>
                        <tr><td>Branch</td><td id="specBranch">Loading...</td></tr>
                    </table>
                </div>
                <div class="product-actions" id="productActions">
                    <button class="btn btn-primary btn-lg" id="addToCartBtn" onclick="addToCart()">
                        <i class="fas fa-shopping-cart"></i> Add to Cart
                    </button>
                    <button class="btn btn-success btn-lg" id="buyNowBtn" onclick="buyNow()">
                        <i class="fas fa-bolt"></i> Buy Now
                    </button>
                    <button class="btn btn-outline" onclick="window.location.href='products.html'">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        let product = null;
        let currentUser = null;

        // ============================================
        // CHECK LOGIN
        // ============================================
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');

        if (user) {
            currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
        }

        // ============================================
        // GET PRODUCT ID FROM URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            document.getElementById('productTitle').textContent = 'Product not found';
            document.getElementById('productDescription').textContent = 'No product ID provided.';
            document.getElementById('addToCartBtn').disabled = true;
            document.getElementById('buyNowBtn').disabled = true;
            showToast('❌ No product specified');
        } else {
            loadProduct(productId);
        }

        // ============================================
        // LOAD PRODUCT
        // ============================================
        async function loadProduct(id) {
            try {
                const response = await fetch(`${API_URL}/products/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    product = data.product;
                    renderProduct(product);
                } else {
                    document.getElementById('productTitle').textContent = 'Product not found';
                    document.getElementById('productDescription').textContent = data.message || 'This product may have been removed.';
                    document.getElementById('addToCartBtn').disabled = true;
                    document.getElementById('buyNowBtn').disabled = true;
                    showToast('❌ Product not found');
                }
            } catch (error) {
                console.error('Error loading product:', error);
                document.getElementById('productTitle').textContent = 'Error loading product';
                document.getElementById('productDescription').textContent = 'Could not load product details. Please try again.';
                showToast('❌ Failed to load product');
            }
        }

        function renderProduct(product) {
            // Breadcrumb
            document.getElementById('productName').textContent = product.name || 'Product';
            document.getElementById('breadcrumb').innerHTML = `
                <a href="dashboard.html">Home</a> &gt;
                <a href="products.html">Products</a> &gt;
                <span>${product.name || 'Product'}</span>
            `;

            // Title
            document.getElementById('productTitle').textContent = product.name || 'Product';

            // Rating
            const avgRating = product.avgRating || 0;
            const reviewCount = product.reviewCount || 0;
            document.getElementById('productRating').innerHTML = `
                ${'⭐'.repeat(Math.round(avgRating))}${'☆'.repeat(5 - Math.round(avgRating))}
                <span>(${reviewCount} reviews)</span>
            `;

            // Price
            const price = product.price || 0;
            const salePrice = product.salePrice || null;
            document.getElementById('productPrice').textContent = `KSh ${parseInt(price).toLocaleString()}`;
            if (salePrice) {
                document.getElementById('productOldPrice').textContent = `KSh ${parseInt(salePrice).toLocaleString()}`;
                document.getElementById('productOldPrice').style.display = 'inline';
            } else {
                document.getElementById('productOldPrice').style.display = 'none';
            }

            // Status
            const statusMap = {
                'available': { class: 'available', text: '● In Stock' },
                'sold': { class: 'sold', text: '● Sold Out' },
                'pre-order': { class: 'pre-order', text: '● Pre-order' }
            };
            const status = statusMap[product.status] || statusMap['available'];
            document.getElementById('productStatus').className = `status ${status.class}`;
            document.getElementById('productStatus').textContent = status.text;

            // Description
            document.getElementById('productDescription').textContent = product.description || 'No description available.';

            // Specs
            document.getElementById('specMaterial').textContent = product.material || 'Not specified';
            document.getElementById('specDimensions').textContent = product.dimensions || 'Not specified';
            document.getElementById('specWeight').textContent = product.weight ? `${product.weight} kg` : 'Not specified';
            document.getElementById('specStock').textContent = product.stock || 0;
            document.getElementById('specCategory').textContent = product.category || 'Uncategorized';
            const branchMap = { 'all': 'All Branches', 'ruiru': 'Ruiru', 'nyeri': 'Nyeri', 'nakuru': 'Nakuru' };
            document.getElementById('specBranch').textContent = branchMap[product.branch] || product.branch || 'All Branches';

            // Images
            const images = product.images || [];
            const mainImage = document.getElementById('mainImage');
            
            if (images.length > 0) {
                const firstImage = images[0];
                const isVideo = firstImage.match(/\.(mp4|webm|mov|avi|mkv)$/i) || firstImage.match(/^data:video\//);
                if (isVideo) {
                    mainImage.innerHTML = `<video controls><source src="${firstImage}"></video>`;
                } else {
                    mainImage.innerHTML = `<img src="${firstImage}" alt="${product.name}" />`;
                }
            } else {
                mainImage.innerHTML = `<i class="fas fa-${product.images && product.images.some(img => img.match(/\.(mp4|webm|mov|avi|mkv)$/i)) ? 'video' : 'image'}" style="font-size:64px;color:#c9a94e;"></i>`;
            }

            // Thumbnails
            const thumbnailsContainer = document.getElementById('thumbnails');
            if (images.length > 1) {
                thumbnailsContainer.innerHTML = images.slice(1).map(img => {
                    const isVideo = img.match(/\.(mp4|webm|mov|avi|mkv)$/i) || img.match(/^data:video\//);
                    return `
                        <div class="thumb" onclick="changeImage(this, '${img}')">
                            ${isVideo ? `<video muted><source src="${img}"></video>` : `<img src="${img}" alt="Thumbnail" />`}
                        </div>
                    `;
                }).join('');
            } else {
                thumbnailsContainer.innerHTML = '';
            }

            // Actions - show/hide based on status
            const isSold = product.status === 'sold';
            const addBtn = document.getElementById('addToCartBtn');
            const buyBtn = document.getElementById('buyNowBtn');
            const actionsContainer = document.getElementById('productActions');

            if (isSold) {
                actionsContainer.innerHTML = `
                    <button class="notify-btn" onclick="notifyMe('${product.id}')">
                        <i class="fas fa-bell"></i> Notify Me When Available
                    </button>
                    <button class="btn btn-outline" onclick="window.location.href='products.html'">
                        <i class="fas fa-arrow-left"></i> Back to Products
                    </button>
                `;
            } else {
                actionsContainer.innerHTML = `
                    <button class="btn btn-primary btn-lg" onclick="addToCart()">
                        <i class="fas fa-shopping-cart"></i> Add to Cart
                    </button>
                    <button class="btn btn-success btn-lg" onclick="buyNow()">
                        <i class="fas fa-bolt"></i> Buy Now
                    </button>
                    <button class="btn btn-outline" onclick="window.location.href='products.html'">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                `;
            }
        }

        // ============================================
        // CHANGE IMAGE
        // ============================================
        function changeImage(element, src) {
            document.querySelectorAll('.thumb').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            const mainImage = document.getElementById('mainImage');
            const isVideo = src.match(/\.(mp4|webm|mov|avi|mkv)$/i) || src.match(/^data:video\//);
            if (isVideo) {
                mainImage.innerHTML = `<video controls><source src="${src}"></video>`;
            } else {
                mainImage.innerHTML = `<img src="${src}" alt="${product?.name || 'Product'}" />`;
            }
        }

        // ============================================
        // ADD TO CART
        // ============================================
        async function addToCart() {
            if (!product) return;
            
            const token = localStorage.getItem('token');
            if (!token) {
                showToast('⚠️ Please login to add items to cart');
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/cart`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ productId: product.id, quantity: 1 })
                });
                const data = await response.json();
                
                if (data.success) {
                    showToast('✅ Added to cart!');
                } else {
                    showToast('❌ ' + (data.message || 'Failed to add to cart'));
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                showToast('❌ Failed to add to cart');
            }
        }

        // ============================================
        // BUY NOW
        // ============================================
        function buyNow() {
            if (!product) return;
            
            const token = localStorage.getItem('token');
            if (!token) {
                showToast('⚠️ Please login to purchase');
                window.location.href = 'login.html';
                return;
            }

            const location = prompt('📍 Enter your delivery location:');
            if (location) {
                addToCart();
                setTimeout(() => {
                    window.location.href = 'checkout.html';
                }, 1000);
            }
        }

        // ============================================
        // NOTIFY ME
        // ============================================
        function notifyMe(productId) {
            showToast('🔔 You will be notified when this product is back in stock!');
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
