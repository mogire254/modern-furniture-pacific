<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Care - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
        
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 32px; color: #1a2a3a; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: #888; margin-top: 8px; font-size: 16px; }
        
        .chat-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            min-height: 500px;
        }
        .chat-sidebar {
            background: #f8f7f4;
            padding: 16px;
            border-right: 1px solid #e9e7e2;
        }
        .chat-sidebar h3 { font-size: 14px; color: #1a2a3a; margin-bottom: 12px; }
        .chat-sidebar .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .chat-sidebar .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e9e7e2;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .chat-sidebar .search-box input:focus {
            outline: none;
            border-color: #c9a94e;
        }
        .chat-sidebar .search-box button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #c9a94e;
            color: #1a2a3a;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-sidebar .search-box button:hover { background: #e8d5a3; }
        
        .conversation-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            border-left: 3px solid transparent;
        }
        .conversation-item:hover { background: #e9e7e2; }
        .conversation-item.active { background: #e9e7e2; border-left-color: #c9a94e; }
        .conversation-item .name { font-weight: 600; color: #1a2a3a; }
        .conversation-item .email { font-size: 12px; color: #888; }
        .conversation-item .preview { font-size: 13px; color: #666; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conversation-item .unread { display: inline-block; background: #ef4444; color: white; border-radius: 50%; padding: 1px 8px; font-size: 10px; margin-left: 8px; }
        .conversation-item .status-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }
        .conversation-item .status-badge.new { background: #dbeafe; color: #1e40af; }
        .conversation-item .status-badge.open { background: #fef3c7; color: #92400e; }
        .conversation-item .status-badge.closed { background: #d1fae5; color: #065f46; }
        
        .chat-main {
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .chat-main .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9e7e2;
            flex-wrap: wrap;
        }
        .chat-main .chat-header .user-info h4 { color: #1a2a3a; }
        .chat-main .chat-header .user-info p { font-size: 12px; color: #888; }
        
        .chat-messages {
            flex: 1;
            max-height: 400px;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            animation: slideIn 0.3s ease-out;
        }
        .chat-message.received { align-self: flex-start; background: #f8f7f4; }
        .chat-message.sent { align-self: flex-end; background: #c9a94e; color: #1a2a3a; }
        .chat-message .sender { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
        .chat-message .time { font-size: 10px; color: #888; margin-top: 2px; display: block; }
        .chat-message.sent .time { color: rgba(26,42,58,0.6); }
        
        .chat-input {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid #e9e7e2;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e9e7e2;
            border-radius: 50px;
            font-size: 14px;
            font-family: inherit;
        }
        .chat-input input:focus { outline: none; border-color: #c9a94e; }
        .chat-input button {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: #c9a94e;
            color: #1a2a3a;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .chat-input button:hover { background: #e8d5a3; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #888; }
        .empty-state i { font-size: 48px; color: #ddd; margin-bottom: 16px; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        .back-link { color: #c9a94e; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .chat-layout { grid-template-columns: 1fr; }
            .chat-sidebar { border-right: none; border-bottom: 1px solid #e9e7e2; }
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Customer <span>Care</span></h1>
            <p>Chat with our support team for immediate assistance.</p>
        </div>

        <div class="chat-layout">
            <!-- Sidebar -->
            <div class="chat-sidebar">
                <h3><i class="fas fa-comments" style="color:#c9a94e;"></i> Conversations</h3>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search by email or phone..." />
                    <button onclick="searchConversations()"><i class="fas fa-search"></i></button>
                </div>
                <div class="conversation-list" id="conversationList">
                    <div class="empty-state" style="padding:20px;">
                        <i class="fas fa-comments"></i>
                        <p>No conversations yet.</p>
                    </div>
                </div>
            </div>

            <!-- Main Chat -->
            <div class="chat-main">
                <div class="chat-header" id="chatHeader">
                    <div class="user-info">
                        <h4 id="chatUserName">Select a conversation</h4>
                        <p id="chatUserEmail">Click on a user to start chatting</p>
                    </div>
                    <button class="btn btn-sm btn-outline" onclick="startNewChat()"><i class="fas fa-plus"></i> Start Chat</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state">
                        <i class="fas fa-comment-dots"></i>
                        <h3>No messages</h3>
                        <p>Select a conversation or start a new chat.</p>
                    </div>
                </div>

                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type your reply..." />
                    <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
                </div>
            </div>
        </div>

        <a href="dashboard.html" class="back-link" style="color:#c9a94e; text-decoration:none; margin-top:16px; display:inline-block;">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');
        let currentUser = null;
        let conversations = [];
        let currentUserId = null;

        // ============================================
        // CHECK LOGIN
        // ============================================
        if (user) {
            currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD CONVERSATIONS
        // ============================================
        async function loadConversations() {
            try {
                const response = await fetch(`${API_URL}/customer-care/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    conversations = data.conversations || [];
                    renderConversations(conversations);
                    if (conversations.length > 0 && !currentUserId) {
                        selectConversation(conversations[0].userId);
                    }
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        function renderConversations(convs) {
            const container = document.getElementById('conversationList');
            
            if (!convs || convs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:20px;">
                        <i class="fas fa-comments"></i>
                        <p>No conversations found.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = convs.map(conv => {
                const isActive = conv.userId === currentUserId;
                const unread = conv.unread || 0;
                const lastMsg = conv.messages && conv.messages.length > 0 
                    ? conv.messages[conv.messages.length - 1].message 
                    : 'No messages';
                const statusClass = conv.status === 'closed' ? 'closed' : (conv.status === 'new' ? 'new' : 'open');
                
                return `
                    <div class="conversation-item ${isActive ? 'active' : ''}" onclick="selectConversation('${conv.userId}')">
                        <div class="name">
                            ${conv.userName || 'Guest'}
                            ${unread > 0 ? `<span class="unread">${unread}</span>` : ''}
                            <span class="status-badge ${statusClass}">${conv.status || 'open'}</span>
                        </div>
                        <div class="email">${conv.userEmail || ''}</div>
                        <div class="preview">${lastMsg.substring(0, 50)}${lastMsg.length > 50 ? '...' : ''}</div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // SEARCH CONVERSATIONS
        // ============================================
        async function searchConversations() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                loadConversations();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/customer-care/search?query=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    conversations = data.conversations || [];
                    renderConversations(conversations);
                    if (conversations.length > 0) {
                        selectConversation(conversations[0].userId);
                    } else {
                        showToast('🔍 No users found for "' + query + '"');
                    }
                }
            } catch (error) {
                console.error('Error searching conversations:', error);
                showToast('❌ Search failed');
            }
        }

        // ============================================
        // SELECT CONVERSATION
        // ============================================
        async function selectConversation(userId) {
            currentUserId = userId;
            
            try {
                const response = await fetch(`${API_URL}/customer-care/user/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    const conv = data.conversation;
                    document.getElementById('chatUserName').textContent = conv.userName || 'Guest';
                    document.getElementById('chatUserEmail').textContent = conv.userEmail || '';
                    
                    renderMessages(conv.messages || []);
                    renderConversations(conversations);
                    
                    // Enable input
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('messageInput').placeholder = 'Type your reply...';
                }
            } catch (error) {
                console.error('Error loading conversation:', error);
                showToast('❌ Failed to load conversation');
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            
            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-dots"></i>
                        <h3>No messages</h3>
                        <p>Start the conversation!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isSent = msg.sender === 'admin';
                const senderName = isSent ? 'You' : (msg.userName || 'Customer');
                const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : '';
                
                return `
                    <div class="chat-message ${isSent ? 'sent' : 'received'}">
                        <div class="sender">${senderName}</div>
                        <div>${msg.message}</div>
                        <span class="time">${time}</span>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        // ============================================
        // SEND MESSAGE (Reply)
        // ============================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentUserId) {
                showToast('⚠️ Select a conversation first');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/customer-care/reply/${currentUserId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    selectConversation(currentUserId);
                    loadConversations();
                    showToast('✅ Reply sent!');
                } else {
                    showToast('❌ ' + (data.message || 'Failed to send message'));
                }
            } catch (error) {
                console.error('Error sending message:', error);
                showToast('❌ Failed to send message');
            }
        }

        // ============================================
        // START NEW CHAT
        // ============================================
        function startNewChat() {
            const email = prompt('Enter user email to start chat:');
            if (!email) return;

            // Search for user by email
            fetch(`${API_URL}/auth/users?email=${encodeURIComponent(email)}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.users && data.users.length > 0) {
                    const user = data.users[0];
                    fetch(`${API_URL}/customer-care/start/${user.id}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            showToast('✅ Chat started!');
                            loadConversations();
                            setTimeout(() => selectConversation(user.id), 500);
                        } else {
                            showToast('❌ ' + (data.message || 'Failed to start chat'));
                        }
                    });
                } else {
                    showToast('❌ User not found. Make sure the email is registered.');
                }
            })
            .catch(error => {
                console.error('Error finding user:', error);
                showToast('❌ Failed to find user');
            });
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('tokenExpiry');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
        });

        // Enter key for message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Enter key for search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchConversations();
        });
    </script>
</body>
</html>
