<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        /* ===== ADMIN LAYOUT ===== */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }
        
        /* ===== HAMBURGER SIDEBAR ===== */
        .admin-sidebar {
            width: 280px;
            background: #1a2a3a;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .admin-sidebar::-webkit-scrollbar { width: 4px; }
        .admin-sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .admin-sidebar::-webkit-scrollbar-thumb { background: #c9a94e; border-radius: 4px; }
        
        .admin-sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-sidebar-header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .admin-sidebar-header .logo img { height: 40px; width: auto; }
        .admin-sidebar-header .logo span { color: white; font-weight: 700; font-size: 16px; }
        .admin-sidebar-header .role-badge {
            background: #c9a94e;
            color: #1a2a3a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }
        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .admin-nav {
            padding: 16px 0;
        }
        .admin-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            position: relative;
        }
        .admin-nav a:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .admin-nav a.active {
            background: rgba(255,255,255,0.08);
            color: #c9a94e;
            border-left-color: #c9a94e;
        }
        .admin-nav a i { width: 20px; text-align: center; font-size: 16px; }
        .admin-nav a .badge {
            position: absolute;
            right: 24px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-nav .logout {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            color: #ef4444;
        }
        .admin-nav .logout:hover { color: #ef4444; }
        
        /* ===== MAIN CONTENT ===== */
        .admin-main {
            flex: 1;
            margin-left: 280px;
        }
        
        /* ===== TOP BAR ===== */
        .admin-topbar {
            background: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #e9e7e2;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
        }
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #1a2a3a;
            padding: 8px;
            transition: all 0.3s ease;
        }
        .hamburger-btn:hover { color: #c9a94e; }
        
        .admin-topbar .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        .admin-topbar .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #c9a94e;
            object-fit: cover;
        }
        .admin-topbar .user-info span { font-weight: 500; color: #1a2a3a; }
        
        /* ===== ADMIN CONTENT ===== */
        .admin-content {
            padding: 32px;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                width: 280px;
                max-width: 80%;
                box-shadow: 2px 0 20px rgba(0,0,0,0.2);
            }
            .admin-sidebar.active {
                transform: translateX(0);
            }
            .close-sidebar {
                display: block;
            }
            .admin-main {
                margin-left: 0;
            }
            .hamburger-btn {
                display: block;
            }
            .admin-topbar {
                padding: 12px 16px;
            }
            .admin-content {
                padding: 16px;
            }
        }
        
        @media (min-width: 769px) {
            .admin-sidebar {
                transform: translateX(0) !important;
            }
            .close-sidebar {
                display: none !important;
            }
            .hamburger-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- This is a layout template - individual admin pages will extend this -->
</body>
</html>
