<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-background .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 42, 58, 0.6);
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 48px;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-container .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-container .logo img {
            height: 60px;
            width: auto;
            margin-bottom: 8px;
        }
        .login-container .logo h1 {
            font-size: 24px;
            color: #1a2a3a;
        }
        .login-container .logo p {
            color: #888;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1a2a3a;
            margin-bottom: 6px;
        }
        .form-group label i {
            color: #c9a94e;
            margin-right: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9e7e2;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.4s ease;
            font-family: inherit;
            background: #f8f7f4;
        }
        .form-group input:focus {
            outline: none;
            border-color: #c9a94e;
            box-shadow: 0 0 0 4px rgba(201,169,78,0.15);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 14px;
        }
        .form-options a {
            color: #c9a94e;
            text-decoration: none;
            font-weight: 500;
        }
        .form-options a:hover {
            text-decoration: underline;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            width: 100%;
            justify-content: center;
        }
        .btn-primary {
            background: #c9a94e;
            color: #1a2a3a;
        }
        .btn-primary:hover {
            background: #e8d5a3;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(201,169,78,0.3);
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .form-footer a {
            color: #c9a94e;
            font-weight: 600;
            text-decoration: none;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }
        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.4s ease;
            position: relative;
            z-index: 2;
        }
        .back-home:hover {
            color: #c9a94e;
        }
        @media (max-width: 768px) {
            .login-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="../assets/videos/ceo-intro.mp4" type="video/mp4" />
        </video>
        <div class="overlay"></div>
    </div>

    <div class="login-page">
        <div class="login-container">
            <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <div class="logo">
                <img src="../assets/images/logo.png" alt="Modern Furniture Pacific" />
                <h1>Modern Furniture Pacific</h1>
                <p>Welcome back! Please login to your account.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="john@example.com" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                </div>
                <div class="form-options">
                    <label><input type="checkbox" id="rememberMe" /> Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p class="form-footer">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
                <div id="loginMessage" class="message"></div>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';

        // ============================================
        // HANDLE LOGIN
        // ============================================
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const msg = document.getElementById('loginMessage');
            
            msg.textContent = '⏳ Logging in...';
            msg.className = 'message';
            msg.style.display = 'block';
            msg.style.background = '#dbeafe';
            msg.style.color = '#1e40af';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    } else {
                        localStorage.removeItem('rememberMe');
                    }
                    
                    msg.textContent = '✅ Login successful! Redirecting...';
                    msg.className = 'message success';
                    msg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    msg.textContent = '❌ ' + (data.message || 'Login failed. Please check your credentials.');
                    msg.className = 'message error';
                    msg.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                msg.textContent = '❌ Network error. Please check your connection.';
                msg.className = 'message error';
                msg.style.display = 'block';
            }
        }

        // ============================================
        // CHECK IF ALREADY LOGGED IN
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                try {
                    const userData = JSON.parse(user);
                    if (userData.role && ['super_admin', 'ceo_admin', 'branch_admin'].includes(userData.role)) {
                        window.location.href = 'admin/admin-login.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } catch (e) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            }
        });
    </script>
</body>
</html>
