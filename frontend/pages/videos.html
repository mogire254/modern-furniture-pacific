<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .page-header {
            background: #1a2a3a;
            color: white;
            padding: 60px 0 40px;
            text-align: center;
        }
        .page-header h1 { font-size: 40px; font-weight: 800; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: rgba(255,255,255,0.7); margin-top: 8px; font-size: 18px; }
        .page-header .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            margin-top: 16px;
            transition: all 0.3s ease;
        }
        .page-header .back-link:hover { color: #c9a94e; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .filter-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 32px 0;
            align-items: center;
            justify-content: space-between;
        }
        .filter-bar .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 10px 16px;
            border: 2px solid #e9e7e2;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            transition: all 0.3s ease;
        }
        .filter-bar select:focus, .filter-bar input:focus {
            outline: none;
            border-color: #c9a94e;
        }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .video-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .video-card .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #f8f7f4;
            overflow: hidden;
        }
        .video-card .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-card .video-wrapper .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a2a3a, #2d4a6a);
            color: white;
            cursor: pointer;
        }
        .video-card .video-wrapper .video-placeholder i {
            font-size: 64px;
            color: #c9a94e;
            transition: all 0.3s ease;
        }
        .video-card .video-wrapper .video-placeholder:hover i {
            transform: scale(1.1);
        }
        .video-card .video-wrapper .video-placeholder .play-text {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 13px;
        }
        .video-card .video-duration {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .video-card .video-info { padding: 20px; }
        .video-card .video-info .video-title { font-size: 18px; font-weight: 700; color: #1a2a3a; margin-bottom: 6px; }
        .video-card .video-info .video-description { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
        .video-card .video-info .video-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #888;
            padding-top: 12px;
            border-top: 1px solid #e9e7e2;
        }
        .video-card .video-info .video-meta i { color: #c9a94e; margin-right: 4px; }
        .video-card .video-info .video-meta .tag {
            background: #f8f7f4;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-state i { font-size: 48px; color: #ddd; margin-bottom: 16px; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .page-header h1 { font-size: 28px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .filter-group { flex-direction: column; }
            .videos-grid { grid-template-columns: 1fr; }
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1>Company <span>Videos</span></h1>
            <p>Watch our latest videos showcasing our furniture, craftsmanship, and showrooms.</p>
            <a href="dashboard.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="🔍 Search videos..." oninput="filterVideos()" />
                <select id="categoryFilter" onchange="filterVideos()">
                    <option value="all">All Categories</option>
                    <option value="showroom">Showroom Tour</option>
                    <option value="product">Product Showcase</option>
                    <option value="craftsmanship">Craftsmanship</option>
                    <option value="testimonial">Customer Testimonial</option>
                    <option value="promo">Promotional</option>
                </select>
            </div>
        </div>

        <!-- Videos Grid -->
        <div class="videos-grid" id="videosGrid">
            <!-- Videos loaded from API -->
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Loading videos...</h3>
            </div>
        </div>

    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        let allVideos = [];

        // ============================================
        // CHECK LOGIN
        // ============================================
        const user = localStorage.getItem('user');
        if (user) {
            const currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
        }

        // ============================================
        // ===== LOAD VIDEOS =====
        // Uses /api/videos (CORRECT)
        // ============================================
        async function loadVideos() {
            const grid = document.getElementById('videosGrid');
            
            try {
                const response = await fetch(`${API_URL}/videos`);
                const data = await response.json();
                
                if (data.success) {
                    // Filter only videos sent to users
                    allVideos = (data.videos || []).filter(v => v.sentToUsers !== false);
                    renderVideos(allVideos);
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                            <h3>Failed to load videos</h3>
                            <p>Please try again later.</p>
                            <button class="btn btn-primary" onclick="loadVideos()" style="margin-top:16px; width:auto;">
                                <i class="fas fa-sync-alt"></i> Retry
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading videos:', error);
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wifi" style="color:#ef4444;"></i>
                        <h3>Network Error</h3>
                        <p>Could not connect to the server.</p>
                        <button class="btn btn-primary" onclick="loadVideos()" style="margin-top:16px; width:auto;">
                            <i class="fas fa-sync-alt"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videosGrid');
            
            if (!videos || videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video"></i>
                        <h3>No Videos Available</h3>
                        <p>Check back later for new videos.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videos.map(video => {
                const isVideo = video.fileType === 'video' || video.type === 'video';
                const categoryMap = {
                    'showroom': 'Showroom Tour',
                    'product': 'Product Showcase',
                    'craftsmanship': 'Craftsmanship',
                    'testimonial': 'Customer Testimonial',
                    'promo': 'Promotional'
                };
                const category = categoryMap[video.category] || 'General';
                
                // Check if video has file data
                const hasFileData = video.fileData && video.fileData.length > 100;
                
                return `
                    <div class="video-card" data-category="${video.category || 'general'}">
                        <div class="video-wrapper">
                            ${hasFileData ? 
                                `<video controls>
                                    <source src="${video.fileData}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>` :
                                `<div class="video-placeholder" onclick="showToast('🎬 Video coming soon')">
                                    <i class="fas fa-play-circle"></i>
                                    <span class="play-text">Click to Play</span>
                                </div>`
                            }
                            <span class="video-duration">${video.duration || '2:30'}</span>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.title || 'Video'}</div>
                            <div class="video-description">${video.note || video.description || 'No description available.'}</div>
                            <div class="video-meta">
                                <span><i class="fas fa-tag"></i> <span class="tag">${category}</span></span>
                                <span><i class="fas fa-calendar"></i> ${video.uploadedAt ? new Date(video.uploadedAt).toLocaleDateString() : 'Recently'}</span>
                                <span><i class="fas fa-eye"></i> ${video.views || 0} views</span>
                                <span><i class="fas fa-thumbs-up"></i> ${video.likes || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // FILTER VIDEOS
        // ============================================
        function filterVideos() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            let filtered = allVideos;

            if (search) {
                filtered = filtered.filter(v => 
                    v.title.toLowerCase().includes(search) || 
                    (v.note && v.note.toLowerCase().includes(search)) ||
                    (v.description && v.description.toLowerCase().includes(search))
                );
            }

            if (category !== 'all') {
                filtered = filtered.filter(v => v.category === category);
            }

            renderVideos(filtered);
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadVideos();
        });
    </script>
</body>
</html>
