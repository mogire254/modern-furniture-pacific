<!-- ===== CLIENT VIDEOS CAROUSEL ===== -->
<div id="clientVideoCarousel" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px; padding:20px;">
    <!-- Videos loaded here -->
</div>

<script>
    // ===== LOAD CLIENT VIDEOS =====
    function loadClientVideos() {
        const container = document.getElementById('clientVideoCarousel');
        if (!container) return;
        
        const saved = localStorage.getItem('clientVideos');
        let videos = saved ? JSON.parse(saved) : [];
        
        if (!videos || videos.length === 0) {
            container.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">
                    <i class="fas fa-video" style="font-size:48px; color:#ddd; margin-bottom:16px;"></i>
                    <h3>No Videos Available</h3>
                    <p style="margin-top:8px;">Check back later for updates from our team.</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = videos.map(v => {
            const isVideo = v.fileType === 'video' || v.type === 'video';
            return `
            <div style="background:#f8f7f4; border-radius:12px; overflow:hidden; border:1px solid #e9e7e2; transition:all 0.3s ease;">
                <div style="height:180px; display:flex; align-items:center; justify-content:center; background:#1a2a3a; color:white; position:relative; overflow:hidden;">
                    ${v.fileData ? (isVideo ? `<video style="width:100%;height:100%;object-fit:cover;"><source src="${v.fileData}"></video>` : `<img src="${v.fileData}" style="width:100%;height:100%;object-fit:cover;" />`) : `<i class="fas fa-${isVideo ? 'video' : 'image'}" style="font-size:48px;"></i>`}
                    ${isVideo ? `<div style="position:absolute;font-size:50px;color:rgba(255,255,255,0.8);text-shadow:0 2px 20px rgba(0,0,0,0.5);"><i class="fas fa-play-circle"></i></div>` : ''}
                    <div style="position:absolute;top:12px;right:12px;background:${isVideo ? '#ef4444' : '#3b82f6'};color:white;padding:2px 12px;border-radius:20px;font-size:10px;font-weight:600;">${isVideo ? '🎬 Video' : '🖼️ Image'}</div>
                </div>
                <div style="padding:16px;">
                    <h4 style="margin-bottom:4px;color:#1a2a3a;">${v.title}</h4>
                    <p style="color:#666;font-size:13px;margin-bottom:8px;">${v.note || ''}</p>
                    <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;">
                        <span>📅 ${new Date(v.uploadedAt).toLocaleDateString()}</span>
                        <span>👁️ ${(v.views || 0) + 1} views</span>
                    </div>
                </div>
            </div>`;
        }).join('');
        
        // Update view counts
        videos.forEach(v => {
            v.views = (v.views || 0) + 1;
        });
        localStorage.setItem('clientVideos', JSON.stringify(videos));
    }
    
    // Load on page load
    document.addEventListener('DOMContentLoaded', loadClientVideos);
    
    // Auto-refresh every 30 seconds
    setInterval(loadClientVideos, 30000);
</script>
