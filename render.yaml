services:
  - type: web
    name: modern-furniture-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: modern_furniture_pacific_live_secret_key_2026
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
