<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Care - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .care-container {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .care-container .logo { text-align: center; margin-bottom: 32px; }
        .care-container .logo img { height: 60px; width: auto; margin-bottom: 8px; }
        .care-container .logo h1 { font-size: 24px; color: #1a2a3a; }
        .care-container .logo p { color: #888; font-size: 14px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1a2a3a;
            margin-bottom: 6px;
        }
        .form-group label i { color: #c9a94e; margin-right: 8px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9e7e2;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #f8f7f4;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #c9a94e;
            box-shadow: 0 0 0 4px rgba(201,169,78,0.15);
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            width: 100%;
            justify-content: center;
        }
        .btn-primary { background: #c9a94e; color: #1a2a3a; }
        .btn-primary:hover { background: #e8d5a3; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(201,169,78,0.3); }
        
        .message-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }
        .message-box.success { display: block; background: #d1fae5; color: #065f46; }
        .message-box.error { display: block; background: #fee2e2; color: #991b1b; }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #c9a94e;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="care-container">
        <div class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <h1>Customer Care</h1>
            <p>We're here to help. Send us a message and our team will respond shortly.</p>
        </div>
        
        <form onsubmit="sendCustomerMessage(event)">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Your Name</label>
                <input type="text" id="careName" placeholder="John Doe" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="careEmail" placeholder="john@example.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone (Optional)</label>
                <input type="tel" id="carePhone" placeholder="+254 700 123 456" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Subject</label>
                <select id="careSubject" required>
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Product Question">Product Question</option>
                    <option value="Order Issue">Order Issue</option>
                    <option value="Delivery">Delivery</option>
                    <option value="Returns">Returns</option>
                    <option value="Custom Order">Custom Order</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-comment"></i> Message</label>
                <textarea id="careMessage" placeholder="Describe your question or issue in detail..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send Message</button>
            <div id="careMessageBox" class="message-box"></div>
        </form>
        
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function sendCustomerMessage(event) {
            event.preventDefault();
            
            const name = document.getElementById('careName').value;
            const email = document.getElementById('careEmail').value;
            const phone = document.getElementById('carePhone').value;
            const subject = document.getElementById('careSubject').value;
            const message = document.getElementById('careMessage').value;
            const msgBox = document.getElementById('careMessageBox');
            
            try {
                const response = await fetch(`${API_URL}/customer-care/user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, subject, message })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    msgBox.textContent = '✅ Your message has been sent! Our team will respond shortly.';
                    msgBox.className = 'message-box success';
                    document.getElementById('careName').value = '';
                    document.getElementById('careEmail').value = '';
                    document.getElementById('carePhone').value = '';
                    document.getElementById('careMessage').value = '';
                } else {
                    msgBox.textContent = '❌ Failed to send message. Please try again.';
                    msgBox.className = 'message-box error';
                }
            } catch (error) {
                console.error('Error sending message:', error);
                msgBox.textContent = '❌ Network error. Please try again.';
                msgBox.className = 'message-box error';
            }
        }
    </script>
</body>
</html>
