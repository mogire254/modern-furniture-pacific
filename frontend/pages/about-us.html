<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
        
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 32px; color: #1a2a3a; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: #888; margin-top: 8px; font-size: 16px; }
        
        .about-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .about-content h2 { color: #1a2a3a; margin-top: 24px; margin-bottom: 12px; }
        .about-content h2:first-child { margin-top: 0; }
        .about-content h2 i { color: #c9a94e; margin-right: 8px; }
        .about-content p { color: #666; line-height: 1.8; font-size: 16px; }
        .about-content .values-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 16px 0;
        }
        .about-content .value-item {
            background: #f8f7f4;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .about-content .value-item i { font-size: 24px; color: #c9a94e; margin-bottom: 4px; }
        .about-content .value-item h4 { color: #1a2a3a; font-size: 14px; }
        
        .back-link { color: #c9a94e; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
            .about-content { padding: 20px; }
            .about-content .values-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>About <span>Modern Furniture Pacific</span></h1>
            <p>Learn more about our company, mission, and values.</p>
        </div>

        <div class="about-content" id="aboutContent">
            <div style="text-align:center; padding:40px; color:#888;">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading about us...</p>
            </div>
        </div>

        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';

        // ============================================
        // CHECK LOGIN
        // ============================================
        const user = localStorage.getItem('user');
        if (user) {
            const currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
        }

        // ============================================
        // LOAD ABOUT US
        // ============================================
        async function loadAboutUs() {
            try {
                const response = await fetch(`${API_URL}/settings/about`);
                const data = await response.json();
                
                const container = document.getElementById('aboutContent');
                
                if (data.success && data.about) {
                    const about = data.about;
                    const values = about.values || ['Quality', 'Innovation', 'Customer Satisfaction', 'Sustainability'];
                    
                    container.innerHTML = `
                        <h2><i class="fas fa-info-circle"></i> Who We Are</h2>
                        <p>${about.description || 'Modern Furniture Pacific is a premier furniture design and manufacturing company based in Kenya. With over 15 years of experience, we specialize in creating luxurious, handcrafted furniture that combines traditional craftsmanship with modern innovation.'}</p>
                        
                        <h2><i class="fas fa-bullseye"></i> Our Mission</h2>
                        <p>${about.mission || 'To provide exceptional furniture that combines quality, style, and affordability while ensuring customer satisfaction.'}</p>
                        
                        <h2><i class="fas fa-eye"></i> Our Vision</h2>
                        <p>${about.vision || 'To be the leading furniture provider in East Africa, known for innovation, quality, and customer service.'}</p>
                        
                        <h2><i class="fas fa-heart"></i> Our Values</h2>
                        <div class="values-grid">
                            ${values.map(value => `
                                <div class="value-item">
                                    <i class="fas fa-check-circle"></i>
                                    <h4>${value}</h4>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div style="margin-top: 24px; padding: 16px; background: #f8f7f4; border-radius: 8px; text-align: center;">
                            <p style="color: #666; font-size: 14px;">
                                <i class="fas fa-calendar-alt" style="color: #c9a94e;"></i> 
                                Founded in 2010 • Proudly Kenyan • Serving East Africa
                            </p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div style="text-align:center; padding:40px; color:#888;">
                            <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                            <p>Could not load about us content.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading about us:', error);
                document.getElementById('aboutContent').innerHTML = `
                    <div style="text-align:center; padding:40px; color:#888;">
                        <i class="fas fa-wifi" style="color:#ef4444;"></i>
                        <p>Network error. Please try again.</p>
                    </div>
                `;
            }
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadAboutUs();
        });
    </script>
</body>
</html>
