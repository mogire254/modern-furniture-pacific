<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applications - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
        
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 32px; color: #1a2a3a; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: #888; margin-top: 8px; font-size: 16px; }
        
        .info-box {
            background: #f8f7f4;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            border-left: 4px solid #c9a94e;
        }
        .info-box p { color: #666; font-size: 14px; }
        .info-box i { color: #c9a94e; margin-right: 8px; }
        
        .application-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }
        .application-card h3 { color: #1a2a3a; margin-bottom: 8px; }
        .application-card .status-open { color: #10b981; font-weight: 600; }
        .application-card .status-closed { color: #ef4444; font-weight: 600; }
        .application-card .deadline { color: #888; font-size: 14px; margin: 8px 0; }
        .application-card .note { color: #666; font-size: 13px; margin-top: 8px; font-style: italic; padding: 8px 12px; background: #fef3c7; border-radius: 8px; }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
        }
        .btn-primary { background: #c9a94e; color: #1a2a3a; }
        .btn-primary:hover { background: #e8d5a3; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(201,169,78,0.3); }
        .btn-outline { background: transparent; color: #1a2a3a; border: 2px solid #e9e7e2; }
        .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        .modal-content .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #888;
            background: none;
            border: none;
            transition: all 0.3s ease;
        }
        .modal-content .close-modal:hover { color: #ef4444; transform: rotate(90deg); }
        .modal-content h2 { margin-bottom: 16px; }
        .modal-content h2 i { color: #c9a94e; margin-right: 8px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #1a2a3a; margin-bottom: 6px; }
        .form-group label i { color: #c9a94e; margin-right: 8px; }
        .form-group label .required { color: #ef4444; margin-left: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9e7e2;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: #f8f7f4;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #c9a94e;
            box-shadow: 0 0 0 4px rgba(201,169,78,0.15);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group .helper { font-size: 12px; color: #888; margin-top: 4px; }
        .form-group input[type="file"] { padding: 8px; background: white; }
        
        .quiz-question {
            background: #f8f7f4;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .quiz-question .q-label { font-weight: 600; color: #1a2a3a; }
        .quiz-question input, .quiz-question textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e9e7e2;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            margin-top: 6px;
        }
        
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }
        .message.success { display: block; background: #d1fae5; color: #065f46; }
        .message.error { display: block; background: #fee2e2; color: #991b1b; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        .file-upload-area {
            border: 2px dashed #e9e7e2;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f7f4;
        }
        .file-upload-area:hover { border-color: #c9a94e; background: #fef9f0; }
        .file-upload-area i { font-size: 32px; color: #c9a94e; }
        .file-upload-area p { color: #888; margin-top: 8px; }
        .file-upload-area .file-name { color: #10b981; font-weight: 600; }
        
        .back-link { color: #c9a94e; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Job <span>Applications</span></h1>
            <p>Apply for positions announced by our CEO. Stay tuned for new opportunities!</p>
        </div>

        <div class="info-box" id="ceoAnnouncement">
            <p><i class="fas fa-bullhorn"></i> <span id="announcementText">Loading announcements...</span></p>
        </div>

        <div id="jobsContainer">
            <div style="text-align:center; padding:40px; color:#888;">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading job openings...</p>
            </div>
        </div>

        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- Application Modal -->
    <div class="modal" id="applicationModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeApplicationModal()">&times;</button>
            <h2><i class="fas fa-paper-plane"></i> <span id="applyJobTitle">Apply for Job</span></h2>
            <form id="applicationForm" onsubmit="submitApplication(event)">
                <input type="hidden" id="applyJobId" />
                
                <div id="applicationFields">
                    <!-- Dynamically loaded from job requirements -->
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:16px;">
                    <i class="fas fa-paper-plane"></i> Submit Application
                </button>
                <div id="applicationMessage" class="message"></div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        let currentUser = null;
        let allJobs = [];

        // ============================================
        // CHECK LOGIN
        // ============================================
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');

        if (user) {
            currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
            // Redirect to login if not logged in
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD JOBS
        // ============================================
        async function loadJobs() {
            try {
                const response = await fetch(`${API_URL}/applications`);
                const data = await response.json();
                
                if (data.success) {
                    allJobs = data.jobs || [];
                    renderJobs(allJobs);
                    loadAnnouncement();
                } else {
                    document.getElementById('jobsContainer').innerHTML = `
                        <div style="text-align:center; padding:40px; color:#888;">
                            <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                            <p>Failed to load jobs. Please refresh.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsContainer').innerHTML = `
                    <div style="text-align:center; padding:40px; color:#888;">
                        <i class="fas fa-wifi" style="color:#ef4444;"></i>
                        <p>Network error. Please check your connection.</p>
                    </div>
                `;
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            
            if (!jobs || jobs.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:#888;">
                        <i class="fas fa-briefcase" style="font-size:48px; color:#ddd;"></i>
                        <h3 style="margin-top:16px;">No Open Positions</h3>
                        <p>Check back later for new opportunities.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = jobs.map(job => {
                const isOpen = job.isOpen !== false;
                const hasDeadline = job.deadline && new Date(job.deadline) < new Date();
                const isClosed = !isOpen || hasDeadline;
                
                return `
                    <div class="application-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                            <h3>${job.title || 'Job Opening'}</h3>
                            <span class="${isClosed ? 'status-closed' : 'status-open'}">● ${isClosed ? 'Closed' : 'Open'}</span>
                        </div>
                        <p style="color:#666; font-size:14px;">📍 ${job.location || 'Nairobi'} | ${job.type || 'Full-time'}</p>
                        ${job.deadline ? `<p class="deadline"><strong>Deadline:</strong> ${new Date(job.deadline).toLocaleDateString()}</p>` : ''}
                        <p style="color:#666; margin:8px 0;">${job.description || ''}</p>
                        ${isClosed ? `<p class="note">💡 This application period has ended. Please wait for the next opening.</p>` : ''}
                        <button class="btn ${isClosed ? 'btn-outline' : 'btn-primary'}" 
                                ${isClosed ? 'disabled' : `onclick="openApplicationModal('${job.id}')"`}>
                            ${isClosed ? 'Applications Closed' : '<i class="fas fa-paper-plane"></i> Apply Now'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function loadAnnouncement() {
            const announcementEl = document.getElementById('announcementText');
            const openJobs = allJobs.filter(j => j.isOpen !== false);
            if (openJobs.length > 0) {
                announcementEl.textContent = `📢 ${openJobs.length} new position${openJobs.length > 1 ? 's' : ''} available! Apply now.`;
            } else {
                announcementEl.textContent = 'No open positions at the moment. Check back later!';
            }
        }

        // ============================================
        // APPLICATION MODAL
        // ============================================
        function openApplicationModal(jobId) {
            const job = allJobs.find(j => j.id === jobId);
            if (!job) return;

            document.getElementById('applyJobId').value = jobId;
            document.getElementById('applyJobTitle').textContent = `Apply for ${job.title}`;
            document.getElementById('applicationMessage').className = 'message';
            document.getElementById('applicationMessage').style.display = 'none';

            // Build dynamic form fields
            const fieldsContainer = document.getElementById('applicationFields');
            let html = '';

            // Name
            html += `
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name <span class="required">*</span></label>
                    <input type="text" id="appName" placeholder="Enter your full name" required />
                </div>
            `;

            // Email
            html += `
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email <span class="required">*</span></label>
                    <input type="email" id="appEmail" placeholder="Enter your email" required />
                </div>
            `;

            // Phone (if required or optional)
            if (job.requiredFields?.includes('phone') || job.optionalFields?.includes('phone')) {
                const isRequired = job.requiredFields?.includes('phone');
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone ${isRequired ? '<span class="required">*</span>' : ''}</label>
                        <input type="tel" id="appPhone" placeholder="+254 700 123 456" ${isRequired ? 'required' : ''} />
                    </div>
                `;
            }

            // Location (if required or optional)
            if (job.requiredFields?.includes('location') || job.optionalFields?.includes('location')) {
                const isRequired = job.requiredFields?.includes('location');
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Location ${isRequired ? '<span class="required">*</span>' : ''}</label>
                        <input type="text" id="appLocation" placeholder="City, Country" ${isRequired ? 'required' : ''} />
                    </div>
                `;
            }

            // Experience
            if (job.requiredFields?.includes('experience') || job.optionalFields?.includes('experience')) {
                const isRequired = job.requiredFields?.includes('experience');
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Experience ${isRequired ? '<span class="required">*</span>' : ''}</label>
                        <textarea id="appExperience" placeholder="Describe your experience..." ${isRequired ? 'required' : ''}></textarea>
                    </div>
                `;
            }

            // Cover Letter
            if (job.requiredFields?.includes('coverLetter') || job.optionalFields?.includes('coverLetter')) {
                const isRequired = job.requiredFields?.includes('coverLetter');
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-file-alt"></i> Cover Letter ${isRequired ? '<span class="required">*</span>' : ''}</label>
                        <textarea id="appCoverLetter" placeholder="Write your cover letter..." ${isRequired ? 'required' : ''}></textarea>
                    </div>
                `;
            }

            // Portfolio
            if (job.optionalFields?.includes('portfolio')) {
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-link"></i> Portfolio/Website</label>
                        <input type="url" id="appPortfolio" placeholder="https://yourportfolio.com" />
                    </div>
                `;
            }

            // Resume Upload
            if (job.requireResume) {
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-file-pdf"></i> Resume/CV <span class="required">*</span></label>
                        <div class="file-upload-area" onclick="document.getElementById('appResume').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload your resume</p>
                            <p class="file-name" id="resumeFileName"></p>
                            <input type="file" id="appResume" accept=".pdf,.doc,.docx" style="display:none" onchange="handleFileUpload(this, 'resumeFileName')" required />
                        </div>
                    </div>
                `;
            }

            // Certificates
            if (job.requireCertificates) {
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Academic Certificates</label>
                        <div class="file-upload-area" onclick="document.getElementById('appCertificates').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload certificates</p>
                            <p class="file-name" id="certFileName"></p>
                            <input type="file" id="appCertificates" accept=".pdf,.jpg,.png" style="display:none" multiple onchange="handleFileUpload(this, 'certFileName')" />
                        </div>
                    </div>
                `;
            }

            // ID Document
            if (job.requireId) {
                html += `
                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> ID/Passport</label>
                        <div class="file-upload-area" onclick="document.getElementById('appId').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload ID/Passport</p>
                            <p class="file-name" id="idFileName"></p>
                            <input type="file" id="appId" accept=".pdf,.jpg,.png" style="display:none" onchange="handleFileUpload(this, 'idFileName')" />
                        </div>
                    </div>
                `;
            }

            // Quiz Questions
            if (job.quizQuestions && job.quizQuestions.length > 0) {
                html += `<h3 style="margin:16px 0; color:#1a2a3a;"><i class="fas fa-question-circle" style="color:#c9a94e;"></i> Quiz Questions</h3>`;
                job.quizQuestions.forEach((q, index) => {
                    html += `
                        <div class="quiz-question">
                            <div class="q-label">Question ${index + 1}: ${q}</div>
                            <textarea id="quizAnswer${index}" placeholder="Write your answer..." rows="2"></textarea>
                        </div>
                    `;
                });
            }

            fieldsContainer.innerHTML = html;

            // Pre-fill with user data
            if (currentUser) {
                document.getElementById('appName').value = currentUser.name || '';
                document.getElementById('appEmail').value = currentUser.email || '';
                if (document.getElementById('appPhone')) {
                    document.getElementById('appPhone').value = currentUser.phone || '';
                }
            }

            document.getElementById('applicationModal').classList.add('active');
        }

        function closeApplicationModal() {
            document.getElementById('applicationModal').classList.remove('active');
        }

        function handleFileUpload(input, fileNameElementId) {
            const file = input.files[0];
            const fileNameEl = document.getElementById(fileNameElementId);
            if (file && fileNameEl) {
                fileNameEl.textContent = `📎 ${file.name}`;
            }
        }

        // ============================================
        // SUBMIT APPLICATION
        // ============================================
        async function submitApplication(event) {
            event.preventDefault();

            const jobId = document.getElementById('applyJobId').value;
            const name = document.getElementById('appName').value;
            const email = document.getElementById('appEmail').value;
            const phone = document.getElementById('appPhone')?.value || '';
            const location = document.getElementById('appLocation')?.value || '';
            const experience = document.getElementById('appExperience')?.value || '';
            const coverLetter = document.getElementById('appCoverLetter')?.value || '';
            const portfolio = document.getElementById('appPortfolio')?.value || '';

            // Get quiz answers
            const job = allJobs.find(j => j.id === jobId);
            const quizAnswers = [];
            if (job && job.quizQuestions) {
                job.quizQuestions.forEach((q, index) => {
                    const answer = document.getElementById(`quizAnswer${index}`)?.value || '';
                    quizAnswers.push(answer);
                });
            }

            // Handle file uploads (simplified - in production, upload to server)
            const files = {};
            const resumeFile = document.getElementById('appResume');
            const certFiles = document.getElementById('appCertificates');
            const idFile = document.getElementById('appId');

            if (resumeFile && resumeFile.files[0]) {
                files.resume = await fileToBase64(resumeFile.files[0]);
            }
            if (certFiles && certFiles.files.length > 0) {
                files.certificates = await Promise.all(
                    Array.from(certFiles.files).map(f => fileToBase64(f))
                );
            }
            if (idFile && idFile.files[0]) {
                files.id = await fileToBase64(idFile.files[0]);
            }

            const applicationData = {
                name,
                email,
                phone,
                location,
                experience,
                coverLetter,
                portfolio,
                quizAnswers,
                files
            };

            const msgEl = document.getElementById('applicationMessage');
            const btn = document.querySelector('#applicationForm button[type="submit"]');
            const originalText = btn.innerHTML;

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
                msgEl.style.display = 'none';

                const response = await fetch(`${API_URL}/applications/${jobId}/apply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(applicationData)
                });

                const data = await response.json();

                if (data.success) {
                    msgEl.className = 'message success';
                    msgEl.textContent = '✅ ' + data.message;
                    msgEl.style.display = 'block';
                    btn.innerHTML = '✅ Submitted!';
                    setTimeout(() => {
                        closeApplicationModal();
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }, 3000);
                    showToast('✅ Application submitted successfully!');
                } else {
                    msgEl.className = 'message error';
                    msgEl.textContent = '❌ ' + (data.message || 'Application failed');
                    msgEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                console.error('Error submitting application:', error);
                msgEl.className = 'message error';
                msgEl.textContent = '❌ Network error. Please try again.';
                msgEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // ============================================
        // FILE TO BASE64 HELPER
        // ============================================
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadJobs();
        });

        // Close modal on outside click
        document.getElementById('applicationModal').addEventListener('click', function(e) {
            if (e.target === this) closeApplicationModal();
        });
    </script>
</body>
</html>
