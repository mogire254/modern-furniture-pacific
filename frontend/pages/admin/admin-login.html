<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #1a2a3a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: white; padding: 48px; border-radius: 16px; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo img { height: 60px; width: auto; margin-bottom: 8px; }
        .logo h1 { font-size: 24px; color: #1a2a3a; }
        .logo .badge-admin { display: inline-block; background: #ef4444; color: white; padding: 4px 20px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 4px; }
        .logo p { color: #888; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #1a2a3a; margin-bottom: 6px; }
        .form-group label i { color: #c9a94e; margin-right: 8px; }
        .form-group input { width: 100%; padding: 14px 18px; border: 2px solid #e9e7e2; border-radius: 12px; font-size: 15px; transition: all 0.4s ease; font-family: inherit; background: #f8f7f4; }
        .form-group input:focus { outline: none; border-color: #c9a94e; box-shadow: 0 0 0 4px rgba(201,169,78,0.15); }
        .form-options { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 14px; }
        .form-options a { color: #c9a94e; text-decoration: none; font-weight: 500; }
        .form-options a:hover { text-decoration: underline; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border: none; border-radius: 50px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.4s ease; font-family: inherit; width: 100%; justify-content: center; }
        .btn-primary { background: #c9a94e; color: #1a2a3a; }
        .btn-primary:hover { background: #e8d5a3; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(201,169,78,0.3); }
        .form-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .form-footer a { color: #c9a94e; font-weight: 600; text-decoration: none; }
        .message { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
        .message.success { display: block; background: #d1fae5; color: #065f46; }
        .message.error { display: block; background: #fee2e2; color: #991b1b; }
        .back-home { display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; margin-bottom: 20px; transition: all 0.4s ease; }
        .back-home:hover { color: #c9a94e; }
        .admin-banner { background: linear-gradient(135deg, #c9a94e, #e8d5a3); padding: 12px 20px; border-radius: 8px; text-align: center; margin-bottom: 24px; color: #1a2a3a; font-weight: 600; font-size: 14px; }
        .admin-banner i { margin-right: 8px; }
        /* ===== FIXED: Separate links ===== */
        .other-logins {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9e7e2;
            text-align: center;
            font-size: 13px;
            color: #888;
        }
        .other-logins a {
            color: #c9a94e;
            text-decoration: none;
        }
        .other-logins a:hover {
            text-decoration: underline;
        }
        .auto-login-badge { background: #10b981; color: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 16px; display: none; }
        .auto-login-badge i { margin-right: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="../../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div class="logo">
            <img src="../../assets/images/logo.png" alt="Logo" />
            <h1>Admin Portal</h1>
            <span class="badge-admin">🔒 Admin Access</span>
            <p>Sign in to manage your branch or system</p>
        </div>
        <div id="autoLoginBadge" class="auto-login-badge"><i class="fas fa-robot"></i> Auto-login in progress...</div>
        <div class="admin-banner"><i class="fas fa-shield-alt"></i> Admin access is restricted to authorized personnel only</div>

        <!-- ===== ADMIN LOGIN FORM ===== -->
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="adminEmail" placeholder="admin@modernfurniturepacific.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required />
            </div>
            <div class="form-options">
                <label><input type="checkbox" id="rememberMe" /> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Admin Login</button>
            <div id="adminLoginMessage" class="message"></div>
        </form>

        <!-- ===== FIXED: Separate links ===== -->
        <div class="other-logins">
            <p>
                <a href="../../pages/login.html"><i class="fas fa-user"></i> User Login</a>
                &nbsp;|&nbsp;
                <a href="../../pages/bulk-buyer/bulk-buyer-login.html" style="color:#8b5cf6;"><i class="fas fa-building"></i> Bulk Buyer Login</a>
            </p>
        </div>
        <p class="form-footer"><a href="#">Contact Support</a></p>
    </div>

    <script>
        const API_URL = 'https://modern-furniture-api.onrender.com/api';

        async function handleAdminLogin(event) {
            event.preventDefault();

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const msg = document.getElementById('adminLoginMessage');

            msg.className = 'message';
            msg.style.display = 'none';

            if (!email || !password) {
                msg.textContent = '⚠️ Please enter both email and password';
                msg.className = 'message error';
                msg.style.display = 'block';
                return;
            }

            msg.textContent = '⏳ Logging in...';
            msg.style.display = 'block';
            msg.style.background = '#dbeafe';
            msg.style.color = '#1e40af';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.success) {
                    const user = data.user;
                    const adminRoles = ['super_admin', 'ceo_admin', 'branch_admin'];

                    if (!adminRoles.includes(user.role)) {
                        msg.textContent = '❌ Access denied. Admin privileges required. Please use the User Login page.';
                        msg.className = 'message error';
                        msg.style.display = 'block';
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(user));
                    sessionStorage.removeItem('loginEmail');
                    sessionStorage.removeItem('autoLogin');

                    msg.textContent = '✅ Admin login successful! Redirecting...';
                    msg.className = 'message success';
                    msg.style.display = 'block';

                    setTimeout(() => {
                        if (user.role === 'super_admin') {
                            window.location.href = 'super-admin.html';
                        } else if (user.role === 'ceo_admin') {
                            window.location.href = 'ceo-admin.html';
                        } else if (user.role === 'branch_admin') {
                            window.location.href = 'branch-admin.html';
                        }
                    }, 1000);
                } else {
                    msg.textContent = '❌ ' + (data.message || 'Invalid email or password');
                    msg.className = 'message error';
                    msg.style.display = 'block';
                }
            } catch (error) {
                console.error('Admin login error:', error);
                msg.textContent = '❌ Network error. Please check your connection.';
                msg.className = 'message error';
                msg.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loginEmail = sessionStorage.getItem('loginEmail');
            const autoLogin = sessionStorage.getItem('autoLogin');

            if (loginEmail && autoLogin === 'true') {
                const badge = document.getElementById('autoLoginBadge');
                badge.style.display = 'block';
                badge.innerHTML = `<i class="fas fa-robot"></i> Auto-login as ${loginEmail}...`;

                const emailField = document.getElementById('adminEmail');
                if (emailField) {
                    emailField.value = loginEmail;
                }

                setTimeout(() => {
                    document.getElementById('adminLoginForm').dispatchEvent(new Event('submit'));
                }, 600);

                setTimeout(() => {
                    sessionStorage.removeItem('loginEmail');
                    sessionStorage.removeItem('autoLogin');
                }, 10000);
                return;
            }

            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');

            if (token && user) {
                try {
                    const userData = JSON.parse(user);
                    const adminRoles = ['super_admin', 'ceo_admin', 'branch_admin'];

                    if (adminRoles.includes(userData.role)) {
                        if (userData.role === 'super_admin') {
                            window.location.href = 'super-admin.html';
                        } else if (userData.role === 'ceo_admin') {
                            window.location.href = 'ceo-admin.html';
                        } else if (userData.role === 'branch_admin') {
                            window.location.href = 'branch-admin.html';
                        }
                    }
                } catch (e) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            }
        });
    </script>
</body>
</html>
