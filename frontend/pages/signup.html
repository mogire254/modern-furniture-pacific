<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }
        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-background .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 42, 58, 0.6);
        }

        .signup-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .signup-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 48px;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .signup-container .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .signup-container .logo img {
            height: 60px;
            width: auto;
            margin-bottom: 8px;
        }
        .signup-container .logo h1 {
            font-size: 24px;
            color: #1a2a3a;
        }
        .signup-container .logo p {
            color: #888;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1a2a3a;
            margin-bottom: 6px;
        }
        .form-group label i {
            color: #c9a94e;
            margin-right: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9e7e2;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.4s ease;
            font-family: inherit;
            background: #f8f7f4;
        }
        .form-group input:focus {
            outline: none;
            border-color: #c9a94e;
            box-shadow: 0 0 0 4px rgba(201,169,78,0.15);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            width: 100%;
            justify-content: center;
        }
        .btn-primary {
            background: #c9a94e;
            color: #1a2a3a;
        }
        .btn-primary:hover {
            background: #e8d5a3;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(201,169,78,0.3);
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .form-footer a {
            color: #c9a94e;
            font-weight: 600;
            text-decoration: none;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }
        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.4s ease;
            position: relative;
            z-index: 2;
        }
        .back-home:hover {
            color: #c9a94e;
        }
        .password-hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        @media (max-width: 768px) {
            .signup-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="../assets/videos/ceo-intro.mp4" type="video/mp4" />
        </video>
        <div class="overlay"></div>
    </div>

    <div class="signup-page">
        <div class="signup-container">
            <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <div class="logo">
                <img src="../assets/images/logo.png" alt="Modern Furniture Pacific" />
                <h1>Modern Furniture Pacific</h1>
                <p>Create your account and start shopping!</p>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="signupEmail" placeholder="john@example.com" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone (Optional)</label>
                    <input type="tel" id="signupPhone" placeholder="+254 700 123 456" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="signupPassword" placeholder="Min 8 characters" required minlength="8" />
                    <div class="password-hint">Must be at least 8 characters</div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                    <input type="password" id="signupConfirm" placeholder="Confirm password" required />
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
                <p class="form-footer">
                    Already have an account? <a href="login.html">Login</a>
                </p>
                <div id="signupMessage" class="message"></div>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';

        // ============================================
        // HANDLE SIGNUP
        // ============================================
        async function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const msg = document.getElementById('signupMessage');
            
            if (password !== confirm) {
                msg.textContent = '❌ Passwords do not match!';
                msg.className = 'message error';
                msg.style.display = 'block';
                return;
            }
            
            if (password.length < 8) {
                msg.textContent = '❌ Password must be at least 8 characters!';
                msg.className = 'message error';
                msg.style.display = 'block';
                return;
            }
            
            msg.textContent = '⏳ Creating account...';
            msg.className = 'message';
            msg.style.display = 'block';
            msg.style.background = '#dbeafe';
            msg.style.color = '#1e40af';
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    msg.textContent = '✅ Account created successfully! Redirecting to login...';
                    msg.className = 'message success';
                    msg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    msg.textContent = '❌ ' + (data.message || 'Registration failed. Please try again.');
                    msg.className = 'message error';
                    msg.style.display = 'block';
                }
            } catch (error) {
                console.error('Signup error:', error);
                msg.textContent = '❌ Network error. Please check your connection.';
                msg.className = 'message error';
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
