<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Modern Furniture Pacific</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f7f4; }
        
        .header {
            background: #1a2a3a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo img { height: 40px; width: auto; }
        .header .logo span { color: white; font-weight: 700; font-size: 18px; }
        .header .user-info { display: flex; align-items: center; gap: 16px; color: white; }
        .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #c9a94e; }
        .header .btn { padding: 8px 20px; border: none; border-radius: 50px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .header .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .header .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
        
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 32px; color: #1a2a3a; }
        .page-header h1 span { color: #c9a94e; }
        .page-header p { color: #888; margin-top: 8px; font-size: 16px; }
        
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
        }
        
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .cart-item {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .cart-item:hover { transform: translateY(-2px); }
        .cart-item .item-image {
            width: 80px;
            height: 80px;
            background: #f8f7f4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #c9a94e;
            overflow: hidden;
            flex-shrink: 0;
        }
        .cart-item .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item .item-image video { width: 100%; height: 100%; object-fit: cover; }
        .cart-item .item-details { flex: 1; }
        .cart-item .item-details h4 { color: #1a2a3a; margin-bottom: 2px; }
        .cart-item .item-details .category { font-size: 12px; color: #888; }
        .cart-item .item-details .price { font-weight: 700; color: #c9a94e; font-size: 18px; }
        .cart-item .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cart-item .item-actions .qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-item .item-actions .qty button {
            width: 30px;
            height: 30px;
            border: 2px solid #e9e7e2;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .cart-item .item-actions .qty button:hover { border-color: #c9a94e; }
        .cart-item .item-actions .qty span { font-weight: 600; min-width: 24px; text-align: center; }
        .cart-item .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .cart-item .remove-btn:hover { transform: scale(1.2); }
        
        .cart-summary {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        .cart-summary h3 { color: #1a2a3a; margin-bottom: 16px; }
        .cart-summary .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #666;
            font-size: 14px;
        }
        .cart-summary .summary-row.total {
            border-top: 2px solid #e9e7e2;
            margin-top: 8px;
            padding-top: 16px;
            font-weight: 700;
            font-size: 18px;
            color: #1a2a3a;
        }
        .cart-summary .summary-row .amount { font-weight: 600; }
        .cart-summary .btn {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
            margin-top: 12px;
        }
        .btn-primary { background: #c9a94e; color: #1a2a3a; }
        .btn-primary:hover { background: #e8d5a3; transform: translateY(-2px); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: transparent; border: 2px solid #e9e7e2; }
        .btn-outline:hover { border-color: #c9a94e; color: #c9a94e; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .empty-cart i { font-size: 64px; color: #ddd; margin-bottom: 16px; }
        .empty-cart h3 { color: #666; margin-bottom: 8px; }
        .empty-cart p { color: #888; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 2000;
            max-width: 400px;
            animation: slideUp 0.3s ease-out;
            display: none;
        }
        .toast.show { display: block; }
        .toast .close { background: none; border: none; color: rgba(255,255,255,0.6); float: right; cursor: pointer; font-size: 18px; }
        
        .back-link { color: #c9a94e; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .cart-container { grid-template-columns: 1fr; }
            .cart-item { flex-wrap: wrap; }
            .cart-item .item-actions { width: 100%; justify-content: space-between; }
            .header { padding: 12px 16px; }
            .header .logo span { font-size: 14px; }
            .container { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/" class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />
            <span>Modern Furniture Pacific</span>
        </a>
        <div class="user-info">
            <span id="userName">Guest</span>
            <button class="btn btn-outline" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Shopping <span>Cart</span></h1>
            <p>Review your items and proceed to checkout.</p>
        </div>

        <div class="cart-container">
            <!-- Cart Items -->
            <div class="cart-items" id="cartItems">
                <!-- Loaded dynamically -->
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <h3>Your cart is empty</h3>
                    <p>Browse our products and add items you love.</p>
                    <a href="products.html" class="btn btn-primary" style="margin-top:16px;">
                        <i class="fas fa-arrow-left"></i> Start Shopping
                    </a>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary" id="cartSummary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span class="amount" id="subtotal">KSh 0</span>
                </div>
                <div class="summary-row">
                    <span>Transport</span>
                    <span class="amount" id="transportCost">KSh 0</span>
                </div>
                <div class="summary-row">
                    <span>Tax (16%)</span>
                    <span class="amount" id="tax">KSh 0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span class="amount" id="total">KSh 0</span>
                </div>
                <button class="btn btn-success" id="checkoutBtn" onclick="proceedToCheckout()" disabled>
                    <i class="fas fa-credit-card"></i> Proceed to Checkout
                </button>
                <button class="btn btn-outline" onclick="clearCart()" style="margin-top:8px;">
                    <i class="fas fa-trash"></i> Clear Cart
                </button>
            </div>
        </div>

        <a href="products.html" class="back-link"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
    </div>

    <div class="toast" id="toast">
        <button class="close" onclick="closeToast()">&times;</button>
        <p id="toastMessage">Notification</p>
    </div>

    <script>
        // ============================================
        // API CONFIGURATION - LIVE
        // ============================================
        const API_URL = 'https://modern-furniture-api.onrender.com/api';
        let currentUser = null;
        let cartData = null;

        // ============================================
        // CHECK LOGIN
        // ============================================
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');

        if (user) {
            currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = currentUser.name || 'User';
        } else {
            document.getElementById('userName').textContent = 'Guest';
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD CART
        // ============================================
        async function loadCart() {
            try {
                const response = await fetch(`${API_URL}/cart`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    cartData = data.cart || { items: [], subtotal: 0, transportCost: 0, total: 0 };
                    renderCart(cartData);
                }
            } catch (error) {
                console.error('Error loading cart:', error);
                showToast('❌ Failed to load cart');
            }
        }

        function renderCart(cart) {
            const itemsContainer = document.getElementById('cartItems');
            const items = cart.items || [];

            if (items.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Your cart is empty</h3>
                        <p>Browse our products and add items you love.</p>
                        <a href="products.html" class="btn btn-primary" style="margin-top:16px;">
                            <i class="fas fa-arrow-left"></i> Start Shopping
                        </a>
                    </div>
                `;
                document.getElementById('checkoutBtn').disabled = true;
                updateSummary(0, 0, 0, 0);
                return;
            }

            itemsContainer.innerHTML = items.map(item => {
                const price = item.price || 0;
                const quantity = item.quantity || 1;
                const total = price * quantity;
                const hasVideo = item.image && (item.image.match(/\.(mp4|webm|mov|avi|mkv)$/i) || item.image.match(/^data:video\//));
                
                return `
                    <div class="cart-item" data-productid="${item.productId}">
                        <div class="item-image">
                            ${item.image ? 
                                (hasVideo ? `<video muted><source src="${item.image}"></video>` : `<img src="${item.image}" alt="${item.name}" />`) : 
                                '<i class="fas fa-couch"></i>'
                            }
                        </div>
                        <div class="item-details">
                            <h4>${item.name || 'Product'}</h4>
                            <div class="category">${item.category || ''}</div>
                            <div class="price">KSh ${total.toLocaleString()}</div>
                        </div>
                        <div class="item-actions">
                            <div class="qty">
                                <button onclick="updateQuantity('${item.productId}', ${quantity - 1})">-</button>
                                <span>${quantity}</span>
                                <button onclick="updateQuantity('${item.productId}', ${quantity + 1})">+</button>
                            </div>
                            <button class="remove-btn" onclick="removeFromCart('${item.productId}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            const subtotal = cart.subtotal || 0;
            const transportCost = cart.transportCost || 0;
            const tax = Math.round(subtotal * 0.16);
            const total = subtotal + transportCost + tax;

            document.getElementById('checkoutBtn').disabled = false;
            updateSummary(subtotal, transportCost, tax, total);
        }

        function updateSummary(subtotal, transport, tax, total) {
            document.getElementById('subtotal').textContent = `KSh ${subtotal.toLocaleString()}`;
            document.getElementById('transportCost').textContent = `KSh ${transport.toLocaleString()}`;
            document.getElementById('tax').textContent = `KSh ${tax.toLocaleString()}`;
            document.getElementById('total').textContent = `KSh ${total.toLocaleString()}`;
        }

        // ============================================
        // UPDATE QUANTITY
        // ============================================
        async function updateQuantity(productId, newQuantity) {
            if (newQuantity < 1) {
                removeFromCart(productId);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/cart/${productId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ quantity: newQuantity })
                });
                const data = await response.json();
                
                if (data.success) {
                    loadCart();
                } else {
                    showToast('❌ ' + (data.message || 'Failed to update quantity'));
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
                showToast('❌ Failed to update quantity');
            }
        }

        // ============================================
        // REMOVE FROM CART
        // ============================================
        async function removeFromCart(productId) {
            try {
                const response = await fetch(`${API_URL}/cart/remove/${productId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    loadCart();
                    showToast('🗑️ Item removed from cart');
                } else {
                    showToast('❌ ' + (data.message || 'Failed to remove item'));
                }
            } catch (error) {
                console.error('Error removing from cart:', error);
                showToast('❌ Failed to remove item');
            }
        }

        // ============================================
        // CLEAR CART
        // ============================================
        async function clearCart() {
            if (!confirm('Clear your entire cart?')) return;

            try {
                const response = await fetch(`${API_URL}/cart/clear`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    loadCart();
                    showToast('🗑️ Cart cleared');
                } else {
                    showToast('❌ ' + (data.message || 'Failed to clear cart'));
                }
            } catch (error) {
                console.error('Error clearing cart:', error);
                showToast('❌ Failed to clear cart');
            }
        }

        // ============================================
        // PROCEED TO CHECKOUT
        // ============================================
        function proceedToCheckout() {
            if (!cartData || !cartData.items || cartData.items.length === 0) {
                showToast('⚠️ Your cart is empty');
                return;
            }

            // Save cart data to session for checkout
            sessionStorage.setItem('checkoutCart', JSON.stringify(cartData));
            window.location.href = 'checkout.html';
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            msg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ============================================
        // LOGOUT
        // ============================================
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });
    </script>
</body>
</html>
